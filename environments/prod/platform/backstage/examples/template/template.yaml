apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: platform-nodejs-service
  title: Platform Node.js service
  description: Creates a catalog-ready Node.js service in the self-hosted GitLab platform group.
spec:
  owner: group:default/platform-team
  type: service
  parameters:
    - title: Service details
      required: [name, description, exposure, owner, resourceProfile]
      properties:
        name:
          title: Name
          type: string
          description: Unique component and repository name.
          pattern: '^[a-z0-9-]+$'
        description:
          title: Description
          type: string
          maxLength: 160
        exposure:
          title: Exposure
          type: string
          default: internal
          enum: [internal, authenticated-web]
        owner:
          title: Catalog owner
          type: string
          default: group:default/platform-team
          pattern: '^(group|user):[a-z0-9][a-z0-9._/-]*$'
        resourceProfile:
          title: Resource profile
          type: string
          default: small
          enum: [small, medium]
        port:
          title: Application port
          type: integer
          default: 3000
          minimum: 1
          maximum: 65535
        runtimeEnvironment:
          title: Non-secret environment settings
          type: object
          maxProperties: 8
          propertyNames:
            maxLength: 48
            pattern: '^(?!.*(?:SECRET|PASSWORD|TOKEN|PRIVATE_KEY|API_KEY))(?!PORT$|HEALTH_PATH$|READINESS_PATH$|METRICS_PATH$)[A-Z][A-Z0-9_]{0,47}(?![\s\S])'
          additionalProperties:
            type: string
            maxLength: 64
            pattern: '^[\x20-\x21\x23\x25-\x26\x28-\x5B\x5D-\x5F\x61-\x7E]*(?![\s\S])'
          default: {}
          description: Up to 8 non-secret settings. Names are uppercase and at most 48 characters; values are at most 64 simple ASCII characters. Never enter passwords, tokens, or private keys.
        secretReferences:
          title: Approved secret references
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            maxLength: 64
            pattern: '^(database-url|api-key|oauth-client-secret)(-v[1-9][0-9]*)?(?![\s\S])'
          default: []
    - title: GitLab repository
      required: [repoUrl]
      properties:
        repoUrl:
          title: Repository location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts: ["gitlab.${DOMAIN}"]
            allowedOwners: [platform/services]
  steps:
    - id: fetch-base
      name: Fetch service skeleton
      action: fetch:template
      input:
        url: ./content
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          exposure: ${{ parameters.exposure }}
          owner: ${{ parameters.owner }}
          resourceProfile: ${{ parameters.resourceProfile }}
          port: ${{ parameters.port }}
          runtimeEnvironmentJson: ${{ parameters.runtimeEnvironment | default({}, true) | dump }}
          secretReferencesJson: ${{ parameters.secretReferences | default([], true) | dump }}
          gitlabBaseUrl: https://gitlab.${DOMAIN}
          monitoringBaseUrl: https://monitoring.${DOMAIN}
          domain: ${DOMAIN}
    - id: publish
      name: Publish to GitLab
      action: publish:gitlab
      input:
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
