apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: platform-nodejs-service
  title: Platform Node.js service
  description: Creates a catalog-ready Node.js service in the self-hosted GitLab platform group.
spec:
  owner: group:default/platform-team
  type: service
  parameters:
    - title: Service details
      required: [name, description, exposure]
      properties:
        name:
          title: Name
          type: string
          description: Unique component and repository name.
          pattern: '^[a-z0-9-]+$'
        description:
          title: Description
          type: string
          maxLength: 160
        exposure:
          title: Exposure
          type: string
          default: internal
          enum: [internal, authenticated-web]
    - title: GitLab repository
      required: [repoUrl]
      properties:
        repoUrl:
          title: Repository location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts: ["gitlab.${DOMAIN}"]
            allowedOwners: [platform/services]
  steps:
    - id: fetch-base
      name: Fetch service skeleton
      action: fetch:template
      input:
        url: ./content
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          exposure: ${{ parameters.exposure }}
          gitlabBaseUrl: https://gitlab.${DOMAIN}
    - id: publish
      name: Publish to GitLab
      action: publish:gitlab
      input:
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
