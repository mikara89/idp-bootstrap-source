stages: [validate, test, image, gitops]
default:
  tags:
    - docker
    - linux
    - idp
    - vm03
variables:
  GET_SOURCES_ATTEMPTS: "3"
  # Retain the shared Runner until platform operators register and select the
  # optional isolated builder Runner through a protected CI variable.
  IDP_BUILD_RUNNER_TAG: "vm03"
  GOLDEN_PATH_ENV_JSON: >-
    ${{ values.runtimeEnvironmentJson }}
  GOLDEN_PATH_SECRET_REFS_JSON: >-
    ${{ values.secretReferencesJson }}
validate:
  stage: validate
  image: node:24-alpine
  script: [node --check index.js]
test:
  stage: test
  image: node:24-alpine
  script: [npm test]
build-image:
  stage: image
  tags:
    - docker
    - linux
    - idp
    - $IDP_BUILD_RUNNER_TAG
  # Mapping syntax with an empty entrypoint so the Docker executor can run the
  # job shell instead of the upstream OCI tool entrypoint.
  image:
    name: quay.io/buildah/stable:v1.39.0
    entrypoint: [""]
  variables:
    # Rootless Buildah layers through fuse-overlayfs. VFS is rejected because it
    # amplifies layer storage and can exhaust the Runner host disk. Keep this
    # aligned with the platform bootstrap image build.
    BUILDAH_ISOLATION: chroot
    STORAGE_DRIVER: overlay
    BUILDAH_STORAGE_OPT: overlay.mount_program=/usr/bin/fuse-overlayfs
    IDP_BUILD_CACHE_DIR: "$CI_PROJECT_DIR/.ci/buildah-storage"
    CONTAINERS_STORAGE_CONF: "$CI_PROJECT_DIR/.ci/containers-storage.conf"
  cache:
    key:
      prefix: node-service-buildah-v1.39.0-node24
      files:
        - package-lock.json
        - Dockerfile
    paths:
      - .ci/buildah-storage/
    policy: pull-push
  before_script:
    - sh ./scripts/buildah-build-hygiene.sh prepare
  script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | buildah login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - buildah --storage-driver "$STORAGE_DRIVER" --storage-opt "$BUILDAH_STORAGE_OPT" bud --build-arg APP_PORT="${{ values.port }}" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - buildah --storage-driver "$STORAGE_DRIVER" --storage-opt "$BUILDAH_STORAGE_OPT" push --digestfile image.digest "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "docker://$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  artifacts: { paths: [image.digest] }
  after_script:
    - sh ./scripts/buildah-build-hygiene.sh cleanup
gitops:
  stage: gitops
  image: curlimages/curl:8.12.1
  rules: [{ if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH' }]
  script:
    - test -n "$GITOPS_TRIGGER_TOKEN"
    - test -n "$GITOPS_TARGET_REF"
    - test -s image.digest
    - |
      env_bytes="$(printf '%s' "$GOLDEN_PATH_ENV_JSON" | wc -c | tr -d '[:space:]')"
      secret_refs_bytes="$(printf '%s' "$GOLDEN_PATH_SECRET_REFS_JSON" | wc -c | tr -d '[:space:]')"
      if [ "$env_bytes" -ge 1024 ] || [ "$secret_refs_bytes" -ge 1024 ]; then
        echo 'Golden Path JSON inputs must each be smaller than 1 KiB.' >&2
        exit 1
      fi
    - curl --fail --request POST --form token="$GITOPS_TRIGGER_TOKEN" --form ref="$GITOPS_TARGET_REF" --form-string "inputs[mode]=golden-path" --form-string "inputs[golden_path_service]=$CI_PROJECT_NAME" --form-string "inputs[golden_path_project]=$CI_PROJECT_PATH" --form-string "inputs[golden_path_image]=$CI_REGISTRY_IMAGE@$(cat image.digest)" --form-string "inputs[golden_path_port]=${{ values.port }}" --form-string "inputs[golden_path_exposure]=${{ values.exposure }}" --form-string "inputs[golden_path_owner]=${{ values.owner }}" --form-string "inputs[golden_path_profile]=${{ values.resourceProfile }}" --form-string "inputs[golden_path_env_json]=$GOLDEN_PATH_ENV_JSON" --form-string "inputs[golden_path_secret_refs_json]=$GOLDEN_PATH_SECRET_REFS_JSON" --form-string "inputs[golden_path_source_revision]=$CI_COMMIT_SHA" "$GITOPS_TRIGGER_URL"
