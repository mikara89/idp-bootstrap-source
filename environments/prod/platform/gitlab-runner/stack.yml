version: "3.8"

# Bootstrap-managed Runner. SwarmCD intentionally does not deploy this stack
# until the future GitOps migration has made GitLab the platform source.
networks:
  platform_net:
    external: true

services:
  gitlab-runner:
    # GitLab Runner 19.3.1, explicitly pinned for controlled upgrades.
    image: gitlab/gitlab-runner:alpine-v19.3.1
    networks:
      - platform_net
    volumes:
      # The control container needs daemon access to launch Docker-executor jobs.
      # Job containers do not inherit this mount from config.toml. This Runner is
      # acceptable only for trusted platform/service repositories. Untrusted
      # third-party repositories need a dedicated worker or isolated executor.
      - ${GITLAB_RUNNER_DATA_PATH}:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.workload == apps
          - node.labels.runner == true
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  # This Runner is provisioned only when the optional image-builder worker is
  # enabled. GITLAB_BUILDER_RUNNER_ENABLED is deliberately the numeric replica
  # count (0 or 1): `docker stack deploy` cannot conditionally omit a service.
  # The default of zero keeps the established manager-hosted Runner topology
  # unchanged while retaining one stack artifact for both modes.
  gitlab-builder-runner:
    # Keep the control-plane image aligned with the standard Runner. The
    # builder-only executor and its concurrency/resource limits belong in the
    # separate Runner TOML rendered by Ansible, not in this Compose file.
    image: gitlab/gitlab-runner:alpine-v19.3.1
    networks:
      - platform_net
    volumes:
      # Docker interpolates every service before applying replicas. Keep a
      # default so the disabled (zero-replica) service does not require a
      # builder path, while enabled deployments can supply their provisioned
      # worker-local path explicitly.
      - ${GITLAB_BUILDER_RUNNER_DATA_PATH:-/mnt/idp/gitlab-builder-runner}:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      replicas: ${GITLAB_BUILDER_RUNNER_ENABLED:-0}
      placement:
        constraints:
          - node.labels.workload == builder
          - node.labels.builder == true
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  # Opt-in MR validation controller on the same apps node as the protected
  # Runner. Replica count is 0 or 1 because `docker stack deploy` cannot omit
  # a service. Job isolation is in the separate Runner TOML, not in this file.
  # The controller still needs the Docker socket to start job containers. That
  # is not VM isolation. Job containers must not receive the socket.
  gitlab-mr-validation-runner:
    image: gitlab/gitlab-runner:alpine-v19.3.1
    networks:
      - platform_net
    volumes:
      - ${GITLAB_MR_VALIDATION_RUNNER_DATA_PATH:-/mnt/idp/gitlab-mr-validation-runner}:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      replicas: ${GITLAB_MR_VALIDATION_RUNNER_ENABLED:-0}
      placement:
        constraints:
          - node.labels.workload == apps
          - node.labels.runner == true
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
