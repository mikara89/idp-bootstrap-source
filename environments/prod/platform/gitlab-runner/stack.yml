version: "3.8"

# Bootstrap-managed Runner. SwarmCD intentionally does not deploy this stack
# until the future GitOps migration has made GitLab the platform source.
networks:
  platform_net:
    external: true

services:
  gitlab-runner:
    # GitLab Runner 19.3.1, explicitly pinned for controlled upgrades.
    image: gitlab/gitlab-runner:19.3.1
    networks:
      - platform_net
    volumes:
      # The control container needs daemon access to launch Docker-executor jobs.
      # Job containers do not inherit this mount from config.toml. This Runner is
      # acceptable only for trusted platform/service repositories. Untrusted
      # third-party repositories need a dedicated worker or isolated executor.
      - ${GITLAB_RUNNER_DATA_PATH}:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.workload == apps
          - node.labels.runner == true
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
