version: "3.8"

# Bootstrap-managed GitLab CE. SwarmCD intentionally does not deploy this stack:
# GitLab must exist before a future GitOps migration can use it.

networks:
  public_net:
    external: true
  platform_net:
    external: true

secrets:
  gitlab_initial_root_password:
    external: true
    name: ${GITLAB_INITIAL_ROOT_PASSWORD_SECRET_NAME}
  gitlab_oidc_client_secret:
    external: true
    name: ${GITLAB_OIDC_CLIENT_SECRET_NAME}

services:
  gitlab:
    # GitLab CE 19.3.1-ce.0, pinned for controlled Omnibus upgrades.
    image: gitlab/gitlab-ce:19.3.1-ce.0
    # Internal Docker hostname only. The Traefik-routed public FQDN must not be
    # claimed here: GitLab and the Runner share platform_net, so Docker embedded
    # DNS would answer for gitlab.${DOMAIN} inside the overlay and clients would
    # dial this task directly on port 443, bypassing Traefik TLS termination.
    hostname: gitlab
    networks:
      - public_net
      - platform_net
    volumes:
      - ${GITLAB_DATA_PATH}/config:/etc/gitlab
      - ${GITLAB_DATA_PATH}/logs:/var/log/gitlab
      - ${GITLAB_DATA_PATH}/data:/var/opt/gitlab
    secrets:
      - source: gitlab_initial_root_password
        target: /run/secrets/gitlab_initial_root_password
        mode: 0400
      - source: gitlab_oidc_client_secret
        target: /run/secrets/gitlab_oidc_client_secret
        mode: 0400
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://gitlab.${DOMAIN}'
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        nginx['real_ip_trusted_addresses'] = ['10.10.0.0/16']
        nginx['real_ip_header'] = 'X-Forwarded-For'
        nginx['real_ip_recursive'] = 'on'
        gitlab_rails['trusted_proxies'] = ['10.10.0.0/16']
        gitlab_rails['initial_root_password'] = File.read('/run/secrets/gitlab_initial_root_password').strip
        gitlab_rails['omniauth_enabled'] = true
        gitlab_rails['omniauth_allow_single_sign_on'] = ['openid_connect']
        gitlab_rails['omniauth_auto_link_user'] = ['openid_connect']
        gitlab_rails['omniauth_block_auto_created_users'] = true
        gitlab_rails['gitlab_signup_enabled'] = false
        gitlab_rails['omniauth_providers'] = [{ name: 'openid_connect', label: 'Keycloak', args: { name: 'openid_connect', scope: ['openid', 'profile', 'email'], response_type: 'code', issuer: 'https://keycloak.${DOMAIN}/realms/idp', discovery: true, client_auth_method: 'basic', uid_field: 'preferred_username', pkce: true, client_options: { identifier: 'gitlab', secret: File.read('/run/secrets/gitlab_oidc_client_secret').strip, redirect_uri: 'https://gitlab.${DOMAIN}/users/auth/openid_connect/callback' } } }]
        gitlab_rails['gitlab_shell_ssh_port'] = 0
        registry_external_url 'https://registry.${DOMAIN}'
        registry['enable'] = true
        registry['registry_http_addr'] = '0.0.0.0:5000'
        registry['nginx']['listen_port'] = 80
        registry['nginx']['listen_https'] = false
        gitlab_rails['registry_path'] = '/var/opt/gitlab/gitlab-rails/shared/registry'
        gitlab_pages['enable'] = false
        mattermost['enable'] = false
        prometheus_monitoring['enable'] = false
        puma['worker_processes'] = 2
        sidekiq['max_concurrency'] = 10
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost/-/readiness || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 10
      start_period: 10m
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.workload == gitlab
      resources:
        limits:
          cpus: "3.0"
          memory: 6G
        reservations:
          cpus: "2.0"
          memory: 4G
      restart_policy:
        condition: on-failure
        delay: 15s
        max_attempts: 5
      labels:
        - traefik.enable=true
        - traefik.swarm.network=public_net
        - traefik.http.routers.gitlab.rule=Host(`gitlab.${DOMAIN}`)
        - traefik.http.routers.gitlab.entrypoints=websecure
        - traefik.http.routers.gitlab.tls.certresolver=le
        - traefik.http.routers.gitlab.service=gitlab
        - traefik.http.services.gitlab.loadbalancer.server.port=80
        - traefik.http.routers.gitlab-registry.rule=Host(`registry.${DOMAIN}`)
        - traefik.http.routers.gitlab-registry.entrypoints=websecure
        - traefik.http.routers.gitlab-registry.tls.certresolver=le
        - traefik.http.routers.gitlab-registry.service=gitlab-registry
        - traefik.http.services.gitlab-registry.loadbalancer.server.port=80
