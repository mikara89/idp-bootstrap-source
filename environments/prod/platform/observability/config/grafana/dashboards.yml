apiVersion: 1

providers:
  - name: "platform"
    orgId: 1
    folder: "Platform"
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/platform

  - name: "teams"
    orgId: 1
    folder: "Teams"
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/teams
