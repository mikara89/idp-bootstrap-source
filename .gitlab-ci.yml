spec:
  inputs:
    mode:
      description: Selects the trusted pipeline operation.
      type: string
      options: [default, golden-path, bootstrap-image-supply]
      default: default
    golden_path_service:
      description: Golden Path service name.
      type: string
      regex: '^([a-z0-9-]+)?$'
      default: ''
    golden_path_project:
      description: Golden Path service project path.
      type: string
      regex: '^(platform/services/[a-z0-9-]+)?$'
      default: ''
    golden_path_image:
      description: Digest-pinned image from the trusted service registry.
      type: string
      regex: '^(registry\.[a-z0-9.-]+/platform/services/[a-z0-9-]+@sha256:[a-f0-9]{64})?$'
      default: ''
    golden_path_port:
      description: Service HTTP port.
      type: string
      regex: '^[1-9][0-9]{0,4}$'
      default: '3000'
    golden_path_exposure:
      description: Requested service exposure mode.
      type: string
      options: [internal, authenticated-web]
      default: internal
    golden_path_owner:
      description: Backstage owner entity.
      type: string
      regex: '^((group|user):[a-z0-9][a-z0-9._/-]*)$'
      default: 'group:default/platform-team'
    golden_path_profile:
      description: Requested resource profile.
      type: string
      options: [small, medium]
      default: small
    golden_path_env_json:
      description: JSON object containing non-secret runtime environment values.
      type: string
      default: '{}'
    golden_path_secret_refs_json:
      description: JSON array of approved runtime secret references.
      type: string
      default: '[]'
    golden_path_source_revision:
      description: Full service source commit revision used for promotion metadata.
      type: string
      regex: '^([a-f0-9]{40,64})?$'
      default: ''
    bootstrap_backstage_required:
      description: Whether the Backstage image must be built and pinned.
      type: boolean
      default: false
    bootstrap_missing_platform_images:
      description: Comma-separated platform image aliases to mirror.
      type: string
      regex: '^([a-z0-9][a-z0-9-]*(,[a-z0-9][a-z0-9-]*)*)?$'
      default: ''
    bootstrap_backstage_source_revision:
      description: Authoritative Backstage source revision to build.
      type: string
      regex: '^([a-f0-9]{40,64})?$'
      default: ''
---
stages:
  - validate
  - test
  - image
  - gitops

default:
  tags:
    - docker
    - linux
    - idp
    # Only the existing shared Runner has vm03. Builder jobs override this
    # default with the optional `builder` tag when that Runner is enabled.
    - vm03

# Image jobs are the only jobs that select the optional isolated builder. The
# shared Runner remains the compatible default until Ansible has registered a
# healthy `builder` Runner and an operator changes this protected variable.
variables:
  GET_SOURCES_ATTEMPTS: "3"
  IDP_BUILD_RUNNER_TAG: "vm03"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && "$[[ inputs.mode ]]" == "golden-path" && "$[[ inputs.golden_path_service ]]" != ""'
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && "$[[ inputs.mode ]]" == "bootstrap-image-supply" && $[[ inputs.bootstrap_backstage_required ]] == true'
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && "$[[ inputs.mode ]]" == "bootstrap-image-supply" && "$[[ inputs.bootstrap_missing_platform_images ]]" != ""'
    # Deduplicate feature-branch work: when a non-default branch has an open
    # merge request, run only the merge-request pipeline instead of a duplicate
    # branch-push pipeline. The default branch is never suppressed, so protected
    # validation on the trusted Runner is always preserved.
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_OPEN_MERGE_REQUESTS && "$[[ inputs.mode ]]" == "default"'
      when: never
    - if: '($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "schedule") && "$[[ inputs.mode ]]" == "default"'
    - when: never

# Merge-request validation routes to the opt-in project-scoped
# idp-platform-mr-validation-runner-01 (tag `platform-mr-validate`). The
# protected default branch and tags keep using the trusted `docker,linux,idp,vm03`
# Runner. GitLab schedules jobs before rules:variables expand tag names, so the
# tag split uses literal tags on separate jobs. Do not add `platform-mr-validate`
# to the protected Runner. Deployment variables must stay protected in GitLab so
# they are never available to merge-request pipelines.

.validate-platform-job: &validate-platform-job
  image: mcr.microsoft.com/powershell:7.4-ubuntu-22.04
  before_script:
    - apt-get update
    - apt-get install -y python-is-python3 python3-yaml python3-jinja2
    - python3 -c "import yaml, jinja2"
  script:
    - python3 scripts/run-validation.py --mode exported-runtime

validate-platform:
  <<: *validate-platform-job
  stage: validate
  tags:
    - platform-mr-validate
    - linux
    - idp
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
      when: never
    - if: '"$[[ inputs.mode ]]" != "default"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'

validate-platform-protected:
  <<: *validate-platform-job
  stage: validate
  tags:
    - docker
    - linux
    - idp
    - vm03
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
      when: never
    - if: '"$[[ inputs.mode ]]" != "default"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

.backstage-build-job: &backstage-build-job
  image: node:24-bookworm-slim
  before_script:
    - corepack enable
  script:
    - cd environments/prod/platform/backstage
    - yarn install --immutable
    - yarn tsc
    - yarn build:backend

backstage-build:
  <<: *backstage-build-job
  stage: test
  tags:
    - platform-mr-validate
    - linux
    - idp
  # The confined platform Runner caps the job at 2048m and mounts a 64 MiB
  # /root tmpfs. Yarn 4 defaults enableGlobalCache and enableMirror to true, so
  # package downloads still land in $HOME/.yarn/berry/cache on that tmpfs even
  # with the global cache disabled. Disable both so Yarn only uses the project
  # workspace cache on the container overlay. Bound the V8 heap so the Backstage
  # compile stays inside the runner limit.
  variables:
    NODE_OPTIONS: "--max-old-space-size=1536"
    YARN_ENABLE_GLOBAL_CACHE: "false"
    YARN_ENABLE_MIRROR: "false"
  before_script:
    - corepack enable
    - df -h /root /tmp "$CI_PROJECT_DIR"
    - df -i /root /tmp "$CI_PROJECT_DIR"
    - mkdir -p "$CI_PROJECT_DIR/.ci-tmp"
    - export TMPDIR="$CI_PROJECT_DIR/.ci-tmp"
    - node -p "require('node:os').tmpdir()"
    - df -h "$TMPDIR" /tmp /root
    - (cd environments/prod/platform/backstage && yarn config get enableGlobalCache)
    - (cd environments/prod/platform/backstage && yarn config get enableMirror)
    - (cd environments/prod/platform/backstage && yarn config get cacheFolder)
  after_script:
    - df -h /root /tmp "$CI_PROJECT_DIR"
    - df -i /root /tmp "$CI_PROJECT_DIR"
    - du -sh /tmp "$CI_PROJECT_DIR/.ci-tmp" "$CI_PROJECT_DIR/environments/prod/platform/backstage/.yarn/cache" 2>/dev/null || true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
      when: never
    - if: '"$[[ inputs.mode ]]" != "default"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'

backstage-build-protected:
  <<: *backstage-build-job
  stage: test
  tags:
    - docker
    - linux
    - idp
    - vm03
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
      when: never
    - if: '"$[[ inputs.mode ]]" != "default"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

.runner-smoke-job: &runner-smoke-job
  image: alpine:3.22
  script:
    - echo "Runner is executing a GitLab CI job"
    - uname -a

runner-smoke:
  <<: *runner-smoke-job
  stage: test
  tags:
    - platform-mr-validate
    - linux
    - idp
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
      when: never
    - if: '"$[[ inputs.mode ]]" != "default"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'

runner-smoke-protected:
  <<: *runner-smoke-job
  stage: test
  tags:
    - docker
    - linux
    - idp
    - vm03
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
      when: never
    - if: '"$[[ inputs.mode ]]" != "default"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# Dedicated first-boot image supply. It uses the authenticated pipeline API
# source, while Golden Path requests use trigger-token provenance.
build-backstage-image:
  stage: image
  timeout: 2h
  tags:
    - docker
    - linux
    - idp
    - $IDP_BUILD_RUNNER_TAG
  # Mapping syntax with an empty entrypoint so the Docker executor can run the
  # job shell instead of the upstream OCI tool entrypoint.
  image:
    name: quay.io/buildah/stable:v1.39.0
    entrypoint: [""]
  variables:
    BOOTSTRAP_BACKSTAGE_REQUIRED:
      value: "$[[ inputs.bootstrap_backstage_required ]]"
      expand: false
    BOOTSTRAP_BACKSTAGE_SOURCE_REVISION:
      value: "$[[ inputs.bootstrap_backstage_source_revision ]]"
      expand: false
    # Rootless Buildah stores layers through fuse-overlayfs. VFS is rejected for
    # these builds: live commissioning measured >30 GB transient layer
    # amplification for the Backstage dependency tree and exhausted the VM3 root
    # disk. The Runner passes /dev/fuse into the job container.
    BUILDAH_ISOLATION: chroot
    STORAGE_DRIVER: overlay
    BUILDAH_STORAGE_OPT: overlay.mount_program=/usr/bin/fuse-overlayfs
    # The source-revision proof below walks commit history. The Runner default of
    # 50 commits can truncate it, which would either fail the proof or resolve a
    # stale source revision, so this job clones the full history.
    GIT_DEPTH: 0
    IDP_BUILD_CACHE_DIR: "$CI_PROJECT_DIR/.ci/buildah-storage"
    CONTAINERS_STORAGE_CONF: "$CI_PROJECT_DIR/.ci/containers-storage.conf"
  cache:
    key:
      prefix: backstage-buildah-v1.39.0-node24
      files:
        - environments/prod/platform/backstage/yarn.lock
        - environments/prod/platform/backstage/.yarnrc.yml
    paths:
      - .ci/buildah-storage/
    policy: pull-push
  before_script:
    - sh ./scripts/buildah-build-hygiene.sh prepare
    # The pinned Buildah image does not ship Git, but the source-revision proof
    # below must independently inspect this checkout. git-core was verified in
    # quay.io/buildah/stable:v1.39.0 and provides /usr/bin/git.
    - microdnf install -y git-core
    - microdnf clean all
    - command -v git
    - git --version
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && "$[[ inputs.mode ]]" == "bootstrap-image-supply" && $[[ inputs.bootstrap_backstage_required ]] == true'
    - when: never
  script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | buildah login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # The image tag must identify the actual Backstage build input, not merely the
    # branch tip: a digest-only GitOps commit lands on the branch after the source
    # revision, so tagging $CI_COMMIT_SHA would tag a commit that changed no
    # build input. Commissioning passes the authoritative source revision it
    # computed from the same source set, and this job refuses to build unless its
    # own checkout proves that revision. The pathspec is the Backstage build
    # context minus the runtime-only stack pin, which is the source set
    # commissioning uses in scripts/backstage-image-freshness.py.
    - |
      set -eu
      : "${BOOTSTRAP_BACKSTAGE_SOURCE_REVISION:?commissioning must supply the authoritative Backstage source revision}"
      printf '%s\n' "$BOOTSTRAP_BACKSTAGE_SOURCE_REVISION" | grep -Eq '^[a-f0-9]{40,64}$'
      SOURCE_REVISION="$(git log -1 --format=%H -- 'environments/prod/platform/backstage' ':(exclude)environments/prod/platform/backstage/stack.yml')"
      test -n "$SOURCE_REVISION"
      if [ "$SOURCE_REVISION" != "$BOOTSTRAP_BACKSTAGE_SOURCE_REVISION" ]; then
        echo "refusing to build: requested Backstage source revision $BOOTSTRAP_BACKSTAGE_SOURCE_REVISION does not match this checkout ($SOURCE_REVISION)" >&2
        exit 1
      fi
    - buildah --storage-driver "$STORAGE_DRIVER" --storage-opt "$BUILDAH_STORAGE_OPT" bud --layers -f environments/prod/platform/backstage/Dockerfile -t "$CI_REGISTRY_IMAGE/backstage:$BOOTSTRAP_BACKSTAGE_SOURCE_REVISION" environments/prod/platform/backstage
    - buildah --storage-driver "$STORAGE_DRIVER" --storage-opt "$BUILDAH_STORAGE_OPT" push --digestfile backstage.digest "$CI_REGISTRY_IMAGE/backstage:$BOOTSTRAP_BACKSTAGE_SOURCE_REVISION" "docker://$CI_REGISTRY_IMAGE/backstage:$BOOTSTRAP_BACKSTAGE_SOURCE_REVISION"
    - printf 'BACKSTAGE_IMAGE_DIGEST=%s\nBACKSTAGE_IMAGE_SOURCE_REVISION=%s\n' "$(cat backstage.digest)" "$BOOTSTRAP_BACKSTAGE_SOURCE_REVISION" > image.env
  artifacts:
    reports:
      dotenv: image.env
  after_script:
    - sh ./scripts/buildah-build-hygiene.sh cleanup

mirror-platform-images:
  stage: image
  tags:
    - docker
    - linux
    - idp
    - $IDP_BUILD_RUNNER_TAG
  # Mapping syntax with an empty entrypoint so the Docker executor can run the
  # job shell instead of the upstream OCI tool entrypoint. Without this, Skopeo
  # consumes the shell "-c" flag and fails with "unknown shorthand flag: 'c'".
  image:
    name: quay.io/skopeo/stable:v1.17.0
    entrypoint: [""]
  variables:
    BOOTSTRAP_MISSING_PLATFORM_IMAGES:
      value: "$[[ inputs.bootstrap_missing_platform_images ]]"
      expand: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && "$[[ inputs.mode ]]" == "bootstrap-image-supply" && "$[[ inputs.bootstrap_missing_platform_images ]]" != ""'
      when: on_success
    - when: never
  before_script:
    - |
      if ! command -v python3 >/dev/null 2>&1; then
        if command -v microdnf >/dev/null 2>&1; then microdnf install -y python3
        elif command -v dnf >/dev/null 2>&1; then dnf install -y python3
        else echo 'python3 is required to validate trusted image targets' >&2; exit 1
        fi
      fi
  script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | skopeo login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - test -n "$BOOTSTRAP_MISSING_PLATFORM_IMAGES"
    # Skopeo's own bounded retry absorbs short-lived upstream/CDN read failures.
    # A live run died with repeated `unexpected EOF` from cdn01.quay.io while
    # walking the Keycloak manifest list, which is not a digest problem. Its
    # default exponential backoff is used deliberately (the pinned skopeo
    # 1.17.0 has no --retry-delay flag), and exhausted retries still fail the
    # job closed.
    - |
      COPY_PLAN="$(python3 scripts/bootstrap-image-supply-plan.py --manifest images/platform-images.yaml emit-copy --names "$BOOTSTRAP_MISSING_PLATFORM_IMAGES")"
      test -n "$COPY_PLAN"
      while read -r source target digest; do
        test -n "$source" && test -n "$target" && test -n "$digest"
        skopeo copy --all --preserve-digests --retry-times 5 "docker://$source" "docker://$CI_REGISTRY_IMAGE/$target"
      done <<< "$COPY_PLAN"

update-backstage-digest:
  stage: gitops
  # Mapping syntax with an empty entrypoint so the Docker executor can run the
  # job shell instead of the upstream OCI tool entrypoint. Without this, the
  # alpine/git ENTRYPOINT consumes the shell command and Git fails with
  # "git: 'sh' is not a git command. See 'git --help'.".
  image:
    name: alpine/git:2.47.2
    entrypoint: [""]
  needs: [build-backstage-image]
  variables:
    BOOTSTRAP_BACKSTAGE_SOURCE_REVISION:
      value: "$[[ inputs.bootstrap_backstage_source_revision ]]"
      expand: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && "$[[ inputs.mode ]]" == "bootstrap-image-supply" && $[[ inputs.bootstrap_backstage_required ]] == true'
    - when: never
  script:
    - test -n "$BACKSTAGE_IMAGE_DIGEST"
    # Bind the pinned digest to the source revision commissioning asked for, so
    # this job can only pin an image that was built from that source.
    - test -n "$BACKSTAGE_IMAGE_SOURCE_REVISION"
    - test -n "$BOOTSTRAP_BACKSTAGE_SOURCE_REVISION"
    - test "$BACKSTAGE_IMAGE_SOURCE_REVISION" = "$BOOTSTRAP_BACKSTAGE_SOURCE_REVISION"
    - git config user.name "IDP GitLab CI"
    - git config user.email "idp-ci@local"
    - git fetch origin "$CI_DEFAULT_BRANCH"
    - test "$(git rev-parse "origin/$CI_DEFAULT_BRANCH")" = "$CI_COMMIT_SHA"
    - git checkout -B "$CI_DEFAULT_BRANCH" "origin/$CI_DEFAULT_BRANCH"
    - printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) printf "%s" gitlab-ci-token ;; *) printf "%s" "$CI_JOB_TOKEN" ;; esac' > /tmp/git-askpass
    - chmod 700 /tmp/git-askpass
    - export GIT_ASKPASS=/tmp/git-askpass GIT_TERMINAL_PROMPT=0
    - sed -i -E "s#(backstage@sha256:)[a-f0-9]{64}#\\1${BACKSTAGE_IMAGE_DIGEST#sha256:}#" environments/prod/platform/backstage/stack.yml
    - git add -- environments/prod/platform/backstage/stack.yml
    # Folded scalar: an unquoted plain scalar containing ": " (as in the
    # conventional-commit subject below) parses as a YAML mapping, and GitLab
    # then rejects the whole pipeline with
    #   jobs:update-backstage-digest:script config should be a string
    #   or a nested array of strings up to 10 levels deep
    - >-
      git diff --cached --quiet ||
      git commit -m "chore(images): update Backstage digest [skip ci]"
    - git push origin "HEAD:$CI_DEFAULT_BRANCH"

golden-path-update:
  stage: gitops
  image: alpine:3.22
  variables:
    PYTHONDONTWRITEBYTECODE: "1"
    GOLDEN_PATH_SERVICE:
      value: "$[[ inputs.golden_path_service ]]"
      expand: false
    GOLDEN_PATH_PROJECT:
      value: "$[[ inputs.golden_path_project ]]"
      expand: false
    GOLDEN_PATH_IMAGE:
      value: "$[[ inputs.golden_path_image ]]"
      expand: false
    GOLDEN_PATH_PORT:
      value: "$[[ inputs.golden_path_port ]]"
      expand: false
    GOLDEN_PATH_EXPOSURE:
      value: "$[[ inputs.golden_path_exposure ]]"
      expand: false
    GOLDEN_PATH_OWNER:
      value: "$[[ inputs.golden_path_owner ]]"
      expand: false
    GOLDEN_PATH_PROFILE:
      value: "$[[ inputs.golden_path_profile ]]"
      expand: false
    GOLDEN_PATH_ENV_JSON:
      value: "$[[ inputs.golden_path_env_json ]]"
      expand: false
    GOLDEN_PATH_SECRET_REFS_JSON:
      value: "$[[ inputs.golden_path_secret_refs_json ]]"
      expand: false
    GOLDEN_PATH_SOURCE_SHA:
      value: "$[[ inputs.golden_path_source_revision ]]"
      expand: false
  resource_group: golden-path-definitions
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && "$[[ inputs.mode ]]" == "golden-path" && "$[[ inputs.golden_path_service ]]" != ""'
  before_script:
    - apk add --no-cache git python3 py3-yaml
  script:
    - test "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH"
    - echo "$GOLDEN_PATH_SERVICE" | grep -Ex '[a-z0-9-]+'
    - echo "$GOLDEN_PATH_PROJECT" | grep -Ex "platform/services/$GOLDEN_PATH_SERVICE"
    - export TRUSTED_REGISTRY="registry.${CI_SERVER_HOST#gitlab.}"
    - test "$TRUSTED_REGISTRY" != "registry."
    - echo "$TRUSTED_REGISTRY" | grep -Ex 'registry\.[a-z0-9.-]+'
    - echo "$GOLDEN_PATH_IMAGE" | grep -E "^${TRUSTED_REGISTRY}/platform/services/$GOLDEN_PATH_SERVICE@sha256:[a-f0-9]{64}$"
    - echo "$GOLDEN_PATH_PORT" | grep -E '^[0-9]+$'
    - test "$GOLDEN_PATH_PORT" -ge 1 -a "$GOLDEN_PATH_PORT" -le 65535
    - test "$GOLDEN_PATH_EXPOSURE" = internal -o "$GOLDEN_PATH_EXPOSURE" = authenticated-web
    - echo "$GOLDEN_PATH_SOURCE_SHA" | grep -E '^[a-f0-9]{40,64}$'
    - git config user.name "IDP GitLab CI"
    - git config user.email "idp-ci@local"
    - git fetch origin "$CI_DEFAULT_BRANCH"
    - git checkout -B "$CI_DEFAULT_BRANCH" "origin/$CI_DEFAULT_BRANCH"
    - python3 scripts/golden-path-promote.py
    - python3 scripts/render-apps-stack.py --registry "$TRUSTED_REGISTRY"
    - python3 -c "import yaml; yaml.safe_load(open('environments/prod/apps/stack.yml')); yaml.safe_load(open('environments/prod/platform/observability/config/file_sd/apps.yml'))"
    - git diff --check
    - python3 scripts/golden-path-stage-commit.py
    - printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) printf "%s" gitlab-ci-token ;; *) printf "%s" "$CI_JOB_TOKEN" ;; esac' > /tmp/git-askpass
    - chmod 700 /tmp/git-askpass
    - export GIT_ASKPASS=/tmp/git-askpass GIT_TERMINAL_PROMPT=0
    - git push origin "HEAD:$CI_DEFAULT_BRANCH"
